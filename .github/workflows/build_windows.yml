name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyusb requests pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name ZyonUnlockTool --hidden-import usb.backend.libusb1 zyon_pc.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZyonUnlockTool-Windows
          path: dist/ZyonUnlockTool.exe
